[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pylabrobot-workcell-demo"
version = "0.1.0"
description = "Device-free lab automation demonstrator with a testable orchestration layer"
requires-python = ">=3.11"
dependencies = [
  "PyLabRobot",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
